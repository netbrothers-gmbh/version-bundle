services:
    mariadb:
        image: mariadb:11.4
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: version_bundle_test
        ports:
            - "3307:3306"
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: version_bundle_test
        ports:
            - "3308:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10
